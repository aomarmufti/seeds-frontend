name: E2E (Playwright)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # Builds the real production output and runs against it. No Vercel
  # dependency, so this is deterministic and is the required check.
  #
  # The old e2e-preview job is not carried over: it never once ran a test
  # (SCRUM-82 — it passed an input the wait action doesn't support, so it
  # 401-looped and timed out). It should come back only on a run that goes
  # green, not on trust.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
