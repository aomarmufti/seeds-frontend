name: E2E (Playwright)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # Always runs, on every push — no dependency on Vercel's deploy timing.
  # Serves the repo root locally (tests-e2e/static-server.js) with the
  # backend mocked at the network boundary, so it's deterministic and
  # doesn't need real Supabase/Stripe/Cal.com test accounts. This is the
  # required check; the preview-deployment job below is best-effort.
  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: playwright-report/
          retention-days: 14

  # DISABLED — see SCRUM-82.
  #
  # This job was meant to run the same suite against the PR's real Vercel
  # preview, which is the only thing that would exercise the genuine Supabase
  # SDK, Vercel routing and the CDN. It has never once done that. It passes
  # `vercel_protection_bypass_header` to wait-for-vercel-preview@v1.3.1, which
  # has no such input (valid ones are token, max_timeout, environment,
  # allow_inactive, check_interval, vercel_password, path), so the bypass
  # secret never reaches the action, Vercel's Deployment Protection answers
  # every poll with a 401, and the step times out after 150 attempts without
  # running a single test.
  #
  # It is disabled rather than left failing on purpose. `continue-on-error`
  # kept it from blocking merges, but it still painted a red X on every PR for
  # a job that tested nothing — and a check everyone has learned to ignore is
  # worse than no check, because it trains people to skim past real failures
  # sitting next to it.
  #
  # SCRUM-82 carries the fix: either find the input this action version really
  # supports for Protection Bypass for Automation, or drop the action and poll
  # the deployment URL directly with Vercel's documented
  # `?x-vercel-protection-bypass=` query param. Re-enable it there, with a run
  # that actually goes green, rather than restoring it here on trust.
  #
  # Until then e2e-local below is the real signal: 30 Playwright tests against
  # a locally served build with the backend mocked at the network boundary.
  # What is NOT covered while this is off: anything that only breaks against
  # the real Supabase SDK in a browser.
  #
  # e2e-preview:
  #   if: github.event_name == 'pull_request'
  #   ...
